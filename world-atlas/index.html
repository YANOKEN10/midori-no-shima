<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ガオン・ワールド｜冒険のつながり</title><link rel="stylesheet" href="style.css?v=64"></head><body><header><div><small>GAON WORLD · WORLD ATLAS</small><h1>冒険のつながり</h1></div><nav><a href="/">ゲームへ</a><a href="map.png?v=64" download>全体図を保存</a></nav></header><main><section class="tools" aria-label="地図の操作"><form id="searchForm"><label class="sr" for="search">場所の名前</label><input id="search" placeholder="町・道路・洞窟を探す" list="places"><datalist id="places"></datalist><button>探す</button></form><div class="zoom-tools"><button id="minus" aria-label="縮小">−</button><button id="plus" aria-label="拡大">＋</button><button id="fit">全体</button><button id="home">出発の町</button></div></section><section class="regions" aria-label="主な町へ移動"><button data-place="village">はじまり</button><button data-place="marine">マリン</button><button data-place="resure">レシューレ</button><button data-place="galaxy">ギャラクシー</button><button data-place="clearTown">クリア</button><span>同じ番号＝つながる出入口</span></section><div class="workspace"><section id="viewport" tabindex="0" aria-label="全体図。ドラッグで移動、ピンチまたは拡大ボタンで拡大"><div id="scene"></div><div class="map-hint">ドラッグで移動 · 番号で接続を確認 <span id="zoom"></span></div></section><aside aria-label="場所と接続の詳細"><div id="details" aria-live="polite">全体図を読み込んでいます…</div><section class="route-box"><h3>行き方を調べる</h3><p>選んだ場所を出発地にします。</p><form id="routeForm"><label for="destination">目的地</label><select id="destination"></select><button>道順を表示</button></form><div id="itinerary" aria-live="polite"></div></section></aside></div><p id="status" role="status"></p></main><footer>実線：徒歩　青の破線：船　金の破線：列車。線の交差は乗り換え地点ではありません。<br>町を選ぶと病院・ショップなどの建物も確認できます。地形はゲームのマップ、配置・距離は模式図です。通行条件はゲーム内で確認してください。</footer><script src="app.js?v=64"></script></body></html>
