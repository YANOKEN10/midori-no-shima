<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="application-name" content="ガオン・ワールド">
<meta name="apple-mobile-web-app-title" content="ガオン・ワールド">
<title>ガオン・ワールド</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="gaon-icon-192.png">
<link rel="apple-touch-icon" href="gaon-apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #141a26;
    font-family: "DotGothic16", "MS Gothic", monospace;
    color: #dfe4ee; touch-action: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  body.touch #stage { inset: 0 0 auto 0; height: 64vh; }
  #screen {
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #cdeeff; display: block;
    box-shadow: 0 0 0 4px #2a3346, 0 12px 40px rgba(0,0,0,.55);
  }

  /* ---- スマホ用のボタン ---- */
  #pad { position: fixed; inset: 0; pointer-events: none; display: none; }
  body.touch #pad { display: block; }
  .btn {
    position: absolute; pointer-events: auto; display: grid; place-items: center;
    background: rgba(30,38,56,.78); border: 2px solid rgba(223,228,238,.45);
    color: #eef2f8; font: 16px "DotGothic16", monospace; border-radius: 12px;
  }
  .btn:active, .btn.on { background: rgba(247,178,58,.75); color: #141a26; }
  #joystick { position:absolute; left:18px; bottom:92px; width:154px; height:154px; border-radius:50%; pointer-events:auto; touch-action:none; background:radial-gradient(circle,rgba(24,91,135,.72) 0 36%,rgba(5,35,64,.92) 38% 100%); border:3px solid rgba(151,225,247,.68); box-shadow:inset 0 8px 22px rgba(255,255,255,.1),0 12px 24px rgba(0,0,0,.38); }
  #joystick::before { content:""; position:absolute; inset:20px; border-radius:50%; border:1px solid rgba(168,231,248,.26); }
  #stickKnob { position:absolute; left:50%; top:50%; width:66px; height:66px; margin:-33px; border-radius:50%; background:radial-gradient(circle at 34% 28%,#58b9e6,#146298 58%,#082f5c); border:3px solid #9de7fa; box-shadow:inset 0 3px 8px rgba(255,255,255,.28),0 8px 16px rgba(0,0,0,.42); transition:transform 55ms linear; }
  #ba { right: 18px; bottom: 150px; width: 76px; height: 76px; border-radius: 50%; font-size: 24px; }
  #bb { right: 100px; bottom: 96px; width: 68px; height: 68px; border-radius: 50%; font-size: 22px; }
  #bs { right: 18px; bottom: 40px; width: 96px; height: 40px; font-size: 13px; }
  #bm { left: 26px; bottom: 40px; width: 96px; height: 40px; font-size: 13px; }

  /* ---- ログイン画面（HTMLで作っています） ---- */
  #gate {
    position: fixed; inset: 0; display: none; place-items: center; z-index: 20;
    background: rgba(14,19,30,.95); padding: 16px; overflow: auto;
  }
  #gate.show { display: grid; }
  .card {
    width: min(440px, 100%); background: #1d2434; border: 3px solid #3d4c6a;
    border-radius: 6px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.7);
  }
  .card h1 { margin: 0 0 4px; font-size: 22px; color: #ffd45c; letter-spacing: 1px; }
  .card p.sub { margin: 0 0 16px; font-size: 13px; color: #9aa6bd; line-height: 1.6; }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    flex: 1; padding: 9px 4px; text-align: center; font-size: 13px; cursor: pointer;
    background: #151b28; border: 2px solid #36415a; color: #9aa6bd; border-radius: 4px;
  }
  .tab.on { background: #e05a44; border-color: #f79a76; color: #fff; }
  label { display: block; font-size: 12px; margin: 12px 0 4px; color: #9aa6bd; }
  input {
    width: 100%; padding: 11px 10px; font: 16px "DotGothic16", monospace;
    background: #121826; border: 2px solid #36415a; color: #eef2f8; border-radius: 4px;
  }
  input:focus { outline: none; border-color: #f7b23a; }
  .hint { font-size: 11px; color: #7e89a0; margin-top: 4px; line-height: 1.5; }
  button.go {
    width: 100%; margin-top: 18px; padding: 13px; font: 16px "DotGothic16", monospace;
    background: #e05a44; border: none; color: #fff; border-radius: 4px; cursor: pointer;
  }
  button.go:disabled { opacity: .5; cursor: default; }
  button.ghost {
    width: 100%; margin-top: 9px; padding: 11px; font: 13px "DotGothic16", monospace;
    background: transparent; border: 2px solid #36415a; color: #9aa6bd; border-radius: 4px; cursor: pointer;
  }
  .msg { margin-top: 12px; font-size: 12.5px; min-height: 18px; line-height: 1.5; }
  .msg.err { color: #ff9a76; }
  .msg.ok { color: #8fe07a; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12px; color: #9aa6bd; }
  .row input[type=checkbox] { width: auto; }
  #whoami {
    position: fixed; top: 6px; right: 8px; z-index: 5; font-size: 11px;
    color: #b9c4d8; background: rgba(20,26,38,.7); padding: 3px 8px; border-radius: 3px;
    pointer-events: auto; cursor: pointer;
  }

  /* Alpine glass controller — 操作配置は維持し、色・質感・視認性を統一 */
  html, body {
    background:
      radial-gradient(circle at 50% 18%, rgba(30,112,160,.28), transparent 38%),
      linear-gradient(165deg, #07182b 0%, #0b2740 48%, #061525 100%);
  }
  #screen {
    border-radius: 10px;
    box-shadow: 0 0 0 2px rgba(114,203,238,.8), 0 0 0 7px rgba(7,31,52,.9),
                0 20px 55px rgba(0,0,0,.58), 0 0 38px rgba(37,166,210,.2);
  }
  body.touch #stage { height: 58vh; padding-top: max(18px, env(safe-area-inset-top)); }
  body.touch #screen { width: min(92vw, 720px) !important; height: auto !important; }
  .btn {
    overflow: hidden;
    border: 2px solid rgba(151,225,247,.82);
    background: linear-gradient(145deg, rgba(28,103,151,.96), rgba(7,39,73,.98));
    color: #f7fdff;
    text-shadow: 0 2px 0 #06213b;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.32), inset 0 -5px 12px rgba(0,18,43,.45),
                0 8px 20px rgba(0,0,0,.34), 0 0 16px rgba(45,186,224,.15);
    backdrop-filter: blur(10px);
  }
  .btn::after {
    content:""; position:absolute; inset:3px; border-radius:inherit;
    border:1px solid rgba(255,255,255,.12); pointer-events:none;
  }
  .btn:active, .btn.on {
    transform: translateY(2px);
    background: linear-gradient(145deg, #f6c75d, #dc7d28);
    border-color:#fff0a8; color:#09233a; text-shadow:none;
    box-shadow: inset 0 2px 7px rgba(111,53,0,.28), 0 3px 9px rgba(0,0,0,.3);
  }
  #joystick.on #stickKnob { box-shadow:inset 0 3px 8px rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.4),0 0 18px rgba(91,214,244,.35); }
  #ba {
    background: radial-gradient(circle at 35% 28%, #ffd978, #e78925 58%, #9e461a);
    border-color:#ffe8a5; color:#17263b; text-shadow:0 1px rgba(255,255,255,.5);
  }
  #bb {
    background: radial-gradient(circle at 35% 28%, #73e5df, #168a9c 60%, #075169);
    border-color:#a9fff5;
  }
  #bs, #bm {
    border-radius:22px; letter-spacing:1.5px;
    background:linear-gradient(145deg,#234f85,#0c2b55);
    border-color:rgba(137,207,244,.72);
  }
  #whoami { color:#d9f5ff; background:rgba(4,28,50,.72); border:1px solid rgba(95,195,231,.25); }
  #gate { background: radial-gradient(circle at 50% 10%, rgba(25,117,158,.36), transparent 42%), rgba(3,18,33,.95); }
  .card {
    background: linear-gradient(165deg, rgba(17,57,84,.97), rgba(7,27,48,.98));
    border: 1px solid rgba(137,219,240,.72); border-radius: 18px;
    box-shadow: inset 0 1px rgba(255,255,255,.18), 0 22px 65px rgba(0,0,0,.55), 0 0 28px rgba(30,165,201,.16);
  }
  .card h1 { color:#fff1a9; text-shadow:0 2px #563b11; }
  .tab { border-radius:10px; background:rgba(4,30,54,.72); border-color:rgba(106,185,216,.38); }
  .tab.on { background:linear-gradient(135deg,#188fa4,#2865a4); border-color:#9cece8; }
  input { border-radius:10px; background:rgba(2,21,40,.8); border-color:rgba(112,192,222,.45); }
  button.go { border-radius:12px; background:linear-gradient(135deg,#e8aa3d,#db7527); box-shadow:0 8px 18px rgba(0,0,0,.28); }
  button.ghost { border-radius:12px; border-color:rgba(112,192,222,.45); color:#caeaf2; }
</style>

<div id="stage"><canvas id="screen" width="320" height="288"></canvas></div>

<div id="pad">
  <div id="joystick" aria-label="移動スティック"><div id="stickKnob"></div></div>
  <div class="btn" id="ba" data-k="a">A</div>
  <div class="btn" id="bb" data-k="b">B</div>
  <div class="btn" id="bs" data-k="start">START</div>
  <div class="btn" id="bm" data-k="select">SELECT</div>
</div>

<div id="whoami"></div>

<div id="gate">
  <div class="card">
    <h1>ガオン・ワールド</h1>
    <p class="sub">ログインすると、パソコンでも スマホでも<br>おなじ ぼうけんの つづきが あそべます。</p>

    <div class="tabs">
      <div class="tab on" data-mode="login">ログイン</div>
      <div class="tab" data-mode="signup">あたらしく つくる</div>
      <div class="tab" data-mode="guest">この たんまつだけ</div>
    </div>

    <form id="form" autocomplete="on">
      <div id="fields">
        <div data-f="who">
          <label for="who">なまえ　または　メールアドレス</label>
          <input id="who" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="ゆうき　または　you@example.com">
        </div>
        <div data-f="name">
          <label for="name">なまえ（ログインにつかいます）</label>
          <input id="name" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="2〜16もじ・スペースなし">
          <p class="hint">ローマ字でも ひらがなでも かまいません。</p>
        </div>
        <div data-f="pw">
          <label for="pw">あいことば</label>
          <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="4もじ いじょう">
        </div>
        <div data-f="mail">
          <label for="mail">メールアドレス（なくても だいじょうぶ）</label>
          <input id="mail" name="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="からっぽでも とうろくできます">
          <p class="hint">いれておくと、なまえを わすれても メールで ログインできます。</p>
        </div>
      </div>

      <div id="guestNote" style="display:none">
        <p class="hint" style="font-size:12.5px; line-height:1.7">
          この たんまつの なかだけに きろくを のこします。<br>
          ほかの きかいには ひきつげません。<br>
          あとから ログインすれば、そのまま クラウドに あずけられます。
        </p>
      </div>

      <button class="go" id="go" type="submit">ログイン</button>
      <button class="ghost" id="skip" type="button">ログインしないで あそぶ</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
</div>

<meta name="voraz-build" content="20260904-recovery-v1">
